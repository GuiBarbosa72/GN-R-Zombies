<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Palco dos Mortos 3D</title>
  <meta name="description" content="Palco dos Mortos 3D: do camarim ao palco, sobreviva às ondas de zumbis.">
  <meta name="theme-color" content="#08060c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B8%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js" defer></script>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="row">
      <div>
        <div id="hname" class="marker">À paisana</div>
        <div id="hpwrap">
          <div id="hp"></div>
          <div id="hptxt">100 / 100</div>
        </div>
        <div id="wave">Camarim</div>
      </div>
      <div>
        <div id="score" class="marker">0</div>
        <div id="combo" class="marker"></div>
      </div>
    </div>
  </div>

  <div id="banner" class="marker"></div>
  
  <div id="prompt" class="marker">Pressione E para interagir</div>

  <div id="ring">
    <div id="knob"></div>
  </div>
  
  <button id="atk" class="marker">Atacar</button>
  <button id="use-btn" class="marker">Interagir [E]</button>

  <!-- Modal do Armário no Camarim -->
  <div id="wardrobe-modal" class="screen">
    <h1 class="marker">Armário de Roupas</h1>
    <p>Escolha o figurino do seu show para entrar em ação:</p>
    <div class="cards">
      <button class="card" data-h="voc">
        <b>Traje do Vocalista</b>
        <span>Bandana, tranças ruivas e o microfone lendário.</span>
      </button>
      <button class="card" data-h="gui">
        <b>Traje do Guitarrista</b>
        <span>Cartola, cachos e a guitarra afiada.</span>
      </button>
    </div>
  </div>

  <div id="pause" class="screen">
    <h1 class="marker">Pausado</h1>
    <p>Clique para continuar.</p>
    <button class="card" id="resume"><b>Continuar</b></button>
  </div>

  <div id="over" class="screen">
    <h1 class="marker">Fim do show</h1>
    <p id="final"></p>
    <button class="card" id="again"><b>Voltar ao Camarim</b></button>
  </div>
</body>
</html>
